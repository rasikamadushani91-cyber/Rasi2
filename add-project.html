<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDB-PIFS | Add Project</title>
    <link rel="stylesheet" href="add-project.css">
    <script src="add-project.js" defer></script>
</head>
<body>

<header class="top-header">
    <div class="logo">
        <div class="logo-icon">RDB</div>
        <div>
            <h2>RDB-PIFS</h2>
            <p>Project Information System</p>
        </div>
    </div>
    <a href="index.html" class="back-link">← Back to Dashboard</a>
</header>

<main class="page-container">
    <div class="page-title">
        <div>
            <span class="eyebrow">PROJECT MANAGEMENT</span>
            <h1>Add New Project</h1>
            <p>Enter the proposed project information below.</p>
        </div>
        <div class="title-icon">📋</div>
    </div>

    <form id="projectForm">
        <section class="form-section">
            <h2>01. Project Information</h2>

            <div class="form-grid">
                <div class="field full-width">
                    <label for="projectName">Project Name *</label>
                    <input id="projectName" name="projectName"
                           placeholder="Enter the proposed project name" required>
                </div>

                <div class="field">
                    <label for="district">District *</label>
                    <select id="district" name="district" required>
                        <option value="">Select District</option>
                        <option>Ampara</option>
                        <option>Anuradhapura</option>
                        <option>Badulla</option>
                        <option>Batticaloa</option>
                        <option>Colombo</option>
                        <option>Galle</option>
                        <option>Gampaha</option>
                        <option>Hambantota</option>
                        <option>Jaffna</option>
                        <option>Kalutara</option>
                        <option>Kandy</option>
                        <option>Kegalle</option>
                        <option>Kurunegala</option>
                        <option>Mannar</option>
                        <option>Matale</option>
                        <option>Matara</option>
                        <option>Monaragala</option>
                        <option>Mullaitivu</option>
                        <option>Nuwara Eliya</option>
                        <option>Polonnaruwa</option>
                        <option>Puttalam</option>
                        <option>Ratnapura</option>
                        <option>Trincomalee</option>
                        <option>Vavuniya</option>
                    </select>
                </div>

                <div class="field">
                    <label for="division">Division *</label>
                    <input id="division" name="division"
                           placeholder="Enter divisional area" required>
                </div>

                <div class="field">
                    <label for="gsDivision">GS Division *</label>
                    <input id="gsDivision" name="gsDivision"
                           placeholder="Enter Grama Niladhari division" required>
                </div>

                <div class="field">
                    <label for="sector">Development Sector *</label>
                    <select id="sector" name="sector" required>
                        <option value="">Select Sector</option>
                        <option>Road Development</option>
                        <option>Water Supply</option>
                        <option>Agriculture</option>
                        <option>Irrigation</option>
                        <option>Education</option>
                        <option>Health</option>
                        <option>Community Development</option>
                        <option>Housing</option>
                        <option>Other</option>
                    </select>
                </div>

                <div class="field">
                    <label for="responsiblePerson">Responsible Person *</label>
                    <input id="responsiblePerson" name="responsiblePerson"
                           placeholder="Officer name" required>
                </div>

                <div class="field">
                    <label for="budget">Estimated Budget (LKR) *</label>
                    <input id="budget" name="budget" type="number"
                           min="0" step="0.01" placeholder="e.g. 2500000" required>
                </div>

                <div class="field">
                    <label for="status">Proposal Status *</label>
                    <select id="status" name="status" required>
                        <option value="Pending">Pending</option>
                        <option value="Ongoing">Ongoing</option>
                        <option value="Completed">Completed</option>
                    </select>
                </div>

                <div class="field full-width">
                    <label for="description">Project Description</label>
                    <textarea id="description" name="description" rows="5"
                        placeholder="Describe the proposed project, objectives and expected benefits"></textarea>
                </div>
            </div>
        </section>

        <div class="form-footer">
            <button type="reset" class="clear-button">Clear Form</button>
            <button type="submit" class="submit-button">
                Submit Project Proposal →
            </button>
        </div>
    </form>

    <p class="footer-note">© <span id="year"></span> RDB-PIFS · Rural Development Bureau</p>
</main>

</body>
</html>
